spring.application.name=keystone-backend

# ============================================
# PostgreSQL Datasource
# ============================================
# We use KEYSTONE-prefixed env var names to avoid collision with other projects.
# Your system has DB_URL / DB_USERNAME / DB_PASSWORD set globally for the old
# Job Portal (MySQL). Using generic names would cause Spring to pick up those
# values instead of KEYSTONE's PostgreSQL config.
#
# ${VAR:default} = use env variable VAR if set, otherwise use the default value.
# In production: set KEYSTONE_DB_PASSWORD to a strong password.
# NEVER commit real credentials to source control.
spring.datasource.url=${KEYSTONE_DB_URL:jdbc:postgresql://localhost:5432/keystone_db}
spring.datasource.username=${KEYSTONE_DB_USERNAME:postgres}
spring.datasource.password=${KEYSTONE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / Hibernate
# ============================================
# 'validate' = Hibernate checks entities match DB schema but does NOT create/alter tables
# Flyway is the ONLY source of truth for schema changes
# Interview tip: ddl-auto options are none, validate, update, create, create-drop
#   - 'update' is dangerous in production (can silently alter tables)
#   - 'validate' is the correct choice when using Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Flyway Database Migration
# ============================================
# Flyway runs versioned SQL scripts from db/migration/ BEFORE Hibernate starts
# This ensures tables exist before Hibernate validates them
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================
# JWT Configuration (used in Phase 2)
# ============================================
# Secret key MUST be at least 256 bits (32 bytes) for HS256 algorithm
# In production: set JWT_SECRET env variable to a strong random value
jwt.secret=${KEYSTONE_JWT_SECRET:keystone-default-dev-secret-key-replace-in-production-256bit}
jwt.expiration-ms=86400000

# ============================================
# Server
# ============================================
server.port=8080
